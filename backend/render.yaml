services:
  - type: web
    name: vendify-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Vendify
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: vendify-backend
          type: web
          property: host
          prefix: https://

      # Base de données PostgreSQL (Render)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: vendify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vendify-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: vendify-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: vendify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vendify-db
          property: password

      # Sessions / Cache (file pour le plan gratuit)
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      # CORS – remplacer par l'URL Vercel après déploiement
      - key: FRONTEND_URL
        value: https://vendify-frontend.vercel.app

      # KiKiaPay – mettre false en production réelle
      - key: KKIAPAY_SANDBOX
        value: true
      - key: KKIAPAY_PRIVATE_KEY
        sync: false   # à renseigner manuellement dans Render Dashboard

      # Mail (optionnel)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 465
      - key: MAIL_ENCRYPTION
        value: ssl
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Vendify

databases:
  - name: vendify-db
    plan: free
    databaseName: vendify
    user: vendify
